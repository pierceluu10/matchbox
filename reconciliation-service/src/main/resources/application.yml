server:
  port: 8082

spring:
  application:
    name: reconciliation-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/reconciliation
    username: ${POSTGRES_USER:matchbox}
    password: ${POSTGRES_PASSWORD:matchbox}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: reconciliation-service
      auto-offset-reset: earliest
    listener:
      concurrency: 6
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

matchbox:
  reconciliation:
    # How long one side may wait for the other before it becomes an exception. Real banks settle
    # in hours or days; the simulator settles in seconds.
    settlement-window: ${SETTLEMENT_WINDOW:30s}
    sweep-interval-ms: 5000
    webhook-secret: ${WEBHOOK_SECRET:local-dev-webhook-secret}

logging:
  level:
    org.apache.kafka: warn
