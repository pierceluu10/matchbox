server:
  port: 8083

spring:
  application:
    name: exception-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/exceptions
    username: ${POSTGRES_USER:matchbox}
    password: ${POSTGRES_PASSWORD:matchbox}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: exception-service
      auto-offset-reset: earliest
    listener:
      concurrency: 6
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus

logging:
  level:
    org.apache.kafka: warn
