server:
  port: 8080

spring:
  application:
    name: payment-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/payments
    username: ${POSTGRES_USER:matchbox}
    password: ${POSTGRES_PASSWORD:matchbox}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: payment-service
      auto-offset-reset: earliest
    listener:
      concurrency: 6
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

matchbox:
  bank:
    url: ${BANK_URL:http://localhost:8081}
    connect-timeout: 1s
    read-timeout: 2s

logging:
  level:
    org.apache.kafka: warn
